<!DOCTYPE html>
<html>
<head>
  <title>Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Meal Browser</h1>
<p>Search meals and click one to view full recipe + ingredients.</p>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search meal">
  <button id="searchBtn">Search</button>
  <button class="linkBtn" id="openPlannerBtn">Open My Meal Plan</button>
</div>

<div class="grid">
  <div class="panel">
    <h3>Meals</h3>
    <div id="mealResults" class="results"></div>
  </div>

  <div class="panel">
    <h3>Recipe</h3>
    <div id="mealDetails" class="details">
      <p>Search and click a meal to see details here.</p>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
